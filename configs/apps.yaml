# Tracked apps. Adding an app = adding an entry here.
apps:
  - id: com.application.zomato
    name: Zomato
    category: food_delivery
  - id: in.swiggy.android
    name: Swiggy
    category: food_delivery
  - id: com.phonepe.app
    name: PhonePe
    category: payments
  - id: net.one97.paytm
    name: Paytm
    category: payments
  - id: com.grofers.customerapp
    name: Blinkit
    category: quick_commerce
  - id: com.zeptoconsumerapp
    name: Zepto
    category: quick_commerce

scrape:
  country: in
  langs: [en, hi]       # Hinglish appears under both
  batch_size: 200       # reviews per request
  sleep_seconds: 1.5    # pause between requests, to stay polite
  max_retries: 4
  first_run_per_lang: 1000     # first time an app is scraped
  max_per_run_per_lang: 20000  # safety cap for later runs
  overlap_hours: 6             # re-check this far back, in case reviews appear late